apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: web, labels: { app: web } }
    spec:
      replicas: 2
      strategy: &rolling { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
      selector: { matchLabels: { app: web } }
      template:
        metadata: { labels: { app: web } }
        spec:
          terminationGracePeriodSeconds: 20
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - { name: tmp, emptyDir: {} }
            - { name: cache, emptyDir: {} }
            - { name: run, emptyDir: {} }
          containers:
            - name: web
              image: arcade/web:placeholder
              ports: [{ name: http, containerPort: 8080 }]
              envFrom: [{ configMapRef: { name: arcade-config } }]
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: cache, mountPath: /var/cache/nginx }
                - { name: run, mountPath: /run }
              startupProbe: { httpGet: { path: /, port: http }, failureThreshold: 12, periodSeconds: 5 }
              readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
              livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20 }
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
  - apiVersion: v1
    kind: Service
    metadata: { name: web }
    spec: { selector: { app: web }, ports: [{ name: http, port: 80, targetPort: http }] }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: gateway, labels: { app: gateway } }
    spec:
      replicas: 2
      strategy: *rolling
      selector: { matchLabels: { app: gateway } }
      template:
        metadata: { labels: { app: gateway } }
        spec:
          terminationGracePeriodSeconds: 20
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          volumes: &tmpVolumes [{ name: tmp, emptyDir: {} }]
          containers:
            - name: gateway
              image: arcade/gateway:placeholder
              ports: [{ name: http, containerPort: 8080 }]
              env: [{ name: PORT, value: "8080" }]
              envFrom:
                - configMapRef: { name: arcade-config }
                - secretRef: { name: arcade-secrets, optional: true }
              volumeMounts: &tmpMount [{ name: tmp, mountPath: /tmp }]
              startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 30, periodSeconds: 5 }
              readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
              livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
              resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
              securityContext: &containerSecurity { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
  - apiVersion: v1
    kind: Service
    metadata: { name: gateway }
    spec: { selector: { app: gateway }, ports: [{ name: http, port: 80, targetPort: http }] }

  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: identity, labels: { app: identity } }
    spec:
      replicas: 2
      strategy: *rolling
      selector: { matchLabels: { app: identity } }
      template:
        metadata: { labels: { app: identity } }
        spec:
          terminationGracePeriodSeconds: 20
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          volumes: *tmpVolumes
          containers:
            - name: identity
              image: arcade/identity:placeholder
              ports: [{ name: http, containerPort: 4101 }]
              env:
                - { name: PORT, value: "4101" }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: arcade-secrets, key: IDENTITY_DATABASE_URL } }
              envFrom: &serviceEnv
                - configMapRef: { name: arcade-config }
                - secretRef: { name: arcade-secrets, optional: true }
              volumeMounts: *tmpMount
              startupProbe: &startup { httpGet: { path: /health/live, port: http }, failureThreshold: 30, periodSeconds: 5 }
              readinessProbe: &ready { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
              livenessProbe: &live { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
              resources: &serviceResources { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
              securityContext: *containerSecurity
  - apiVersion: v1
    kind: Service
    metadata: { name: identity }
    spec: { selector: { app: identity }, ports: [{ name: http, port: 4101, targetPort: http }] }

  - apiVersion: apps/v1
