          volumes: *tmpVolumes
          containers:
            - name: catalog
              image: arcade/catalog:placeholder
              ports: [{ name: http, containerPort: 4102 }]
              env:
                - { name: PORT, value: "4102" }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: arcade-secrets, key: CATALOG_DATABASE_URL } }
              envFrom: *serviceEnv
              volumeMounts: *tmpMount
              startupProbe: *startup
              readinessProbe: *ready
              livenessProbe: *live
              resources: *serviceResources
              securityContext: *containerSecurity
  - apiVersion: v1
    kind: Service
    metadata: { name: catalog }
    spec: { selector: { app: catalog }, ports: [{ name: http, port: 4102, targetPort: http }] }

