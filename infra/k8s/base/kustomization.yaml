apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arcade
resources:
  - namespace.yaml
  - configmap.yaml
  - workloads.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: arcade-booking
    includeSelectors: true
# Overlays replace OWNER and the git SHA. Never promote :latest.
images:
  - name: arcade/web
    newName: ghcr.io/OWNER/arcade-web
    newTag: replace-me-with-git-sha
  - name: arcade/gateway
    newName: ghcr.io/OWNER/arcade-gateway
    newTag: replace-me-with-git-sha
  - name: arcade/identity
    newName: ghcr.io/OWNER/arcade-identity
    newTag: replace-me-with-git-sha
  - name: arcade/catalog
    newName: ghcr.io/OWNER/arcade-catalog
    newTag: replace-me-with-git-sha
  - name: arcade/booking
    newName: ghcr.io/OWNER/arcade-booking
    newTag: replace-me-with-git-sha
  - name: arcade/payment
    newName: ghcr.io/OWNER/arcade-payment
    newTag: replace-me-with-git-sha
  - name: arcade/notification
    newName: ghcr.io/OWNER/arcade-notification
    newTag: replace-me-with-git-sha
  - name: arcade/inventory
    newName: ghcr.io/OWNER/arcade-inventory
    newTag: replace-me-with-git-sha
  - name: arcade/analytics
    newName: ghcr.io/OWNER/arcade-analytics
    newTag: replace-me-with-git-sha
