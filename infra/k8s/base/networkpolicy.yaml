# Default deny inbound pod traffic. Kubelet probes are typically allowed by
# the CNI; kube-system is listed so metrics and probes still work on strict meshes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-probes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# Public edge: Ingress controller reaches web and gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-edge
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [web, gateway] }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: http }
---
# Gateway may call identity, catalog, booking, and payment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-http-services
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [identity, catalog, booking, payment, analytics] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - { protocol: TCP, port: http }
---
# Booking saga also reads catalog directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-booking-to-catalog
spec:
  podSelector:
    matchLabels: { app: catalog }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: booking }
      ports:
        - { protocol: TCP, port: http }
