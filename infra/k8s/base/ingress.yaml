apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcade
  annotations:
    # Replace for your ingress controller. AWS guidance uses ALB annotations.
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: arcade.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
