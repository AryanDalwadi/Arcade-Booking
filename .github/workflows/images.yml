name: Container images

on:
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "infra/docker/**"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "infra/docker/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish scanned images to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, workspace: "@arcade/web", path: "apps/web", dockerfile: "apps/web/Dockerfile" }
          - { name: gateway, workspace: "@arcade/api-gateway", path: "apps/api-gateway", dockerfile: "apps/api-gateway/Dockerfile" }
          - { name: identity, workspace: "@arcade/identity-service", path: "services/identity", dockerfile: "infra/docker/node.Dockerfile" }
          - { name: catalog, workspace: "@arcade/catalog-service", path: "services/catalog", dockerfile: "infra/docker/node.Dockerfile" }
          - { name: booking, workspace: "@arcade/booking-service", path: "services/booking", dockerfile: "infra/docker/node.Dockerfile" }
          - { name: payment, workspace: "@arcade/payment-service", path: "services/payment", dockerfile: "infra/docker/node.Dockerfile" }
          - { name: notification, workspace: "@arcade/notification-service", path: "services/notification", dockerfile: "infra/docker/node.Dockerfile" }
          - { name: inventory, workspace: "@arcade/inventory-service", path: "services/inventory", dockerfile: "infra/docker/node.Dockerfile" }
          - { name: analytics, workspace: "@arcade/analytics-service", path: "services/analytics", dockerfile: "infra/docker/node.Dockerfile" }
    steps:
      - uses: actions/checkout@v4
      - name: Detect workspace and normalize image name
        id: workspace
        shell: bash
        run: |
          if [[ -f "${{ matrix.path }}/package.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.name }} because ${{ matrix.path }}/package.json does not exist yet."
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arcade-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.workspace.outputs.exists == 'true'
      - name: Build local image
        if: steps.workspace.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.workspace.outputs.image }}:${{ github.sha }}
          build-args: |
            WORKSPACE=${{ matrix.workspace }}
            SERVICE_PATH=${{ matrix.path }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        if: steps.workspace.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.workspace.outputs.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: >-
          steps.workspace.outputs.exists == 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image
        if: >-
          steps.workspace.outputs.exists == 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: bash
        run: docker push "${{ steps.workspace.outputs.image }}:${{ github.sha }}"
