name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Install, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Reject tracked secret-like files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)id_rsa$'; then
            echo "::error::Secret-like files must not be committed"
            exit 1
          fi
          echo "No tracked .env or key files"

  infrastructure:
    name: Validate delivery assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Validate Compose model
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Render Kubernetes base
        run: kubectl kustomize infra/k8s/base > /tmp/arcade-k8s.yaml
      - name: Render AWS overlay (map only)
        run: kubectl kustomize infra/k8s/overlays/aws > /tmp/arcade-k8s-aws.yaml
      - name: Reject mutable latest tags in rendered manifests
        run: |
          if grep -E 'image:[[:space:]]*.*:latest([[:space:]]|$)' /tmp/arcade-k8s.yaml /tmp/arcade-k8s-aws.yaml; then
            echo "::error::Rendered manifests must not use :latest"
            exit 1
          fi
          echo "Rendered images use placeholder SHA tags, not latest"
      - name: Check Terraform formatting
        run: terraform -chdir=infra/aws fmt -check -recursive
      - name: Initialize Terraform providers
        run: terraform -chdir=infra/aws init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=infra/aws validate
